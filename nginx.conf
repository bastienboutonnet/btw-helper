server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve CSV with the right type so fetch("sample.csv") works cleanly
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        text/csv                              csv;
    }

    gzip on;
    gzip_types text/css application/javascript text/csv;

    location / {
        try_files $uri $uri/ /index.html;
        # Filenames aren't content-hashed (no build step), so tell browsers and
        # the Cloudflare edge to revalidate every time (cheap 304s via ETag).
        # Without this, a redeploy leaves stale app.js / styles.css cached while
        # index.html refreshes — a broken half-updated page.
        add_header Cache-Control "no-cache" always;
    }
}
