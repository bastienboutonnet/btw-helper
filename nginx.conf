server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve CSV with the right type so fetch("sample.csv") works cleanly
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        text/csv                              csv;
    }

    gzip on;
    gzip_types text/css application/javascript text/csv;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
